<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BK-Commerce{% endblock %} · BK-Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&subset=vietnamese&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="{{ url_for('san_pham') }}"><span class="logo"><img src="{{ url_for('static', filename='img/logo.png') }}" alt=""></span>BK-Commerce</a>
  <nav class="tabs">
    <a href="{{ url_for('san_pham') }}" class="{{ 'on' if endpoint == 'san_pham' else '' }}">Quản lý sản phẩm</a>
    <a href="{{ url_for('chi_tiet_don_hang') }}" class="{{ 'on' if endpoint and endpoint.startswith('chi_tiet_don_hang') else '' }}">Chi tiết đơn hàng</a>
  </nav>
</div></header>
<main class="wrap-page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="msgs">{% for cat, m in messages %}<div class="msg {{ cat }}">{{ m }}</div>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
